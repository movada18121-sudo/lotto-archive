<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แผงควบคุมสุ่มเลข</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f5f0;--card:#fff;--ink:#1f1b16;--mute:#6b645a;--line:#e6e0d4;--acc:#b3261e;--ok:#1e7a3c;--warn:#b26a00}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai",system-ui,sans-serif;font-size:15px}
header{padding:16px 20px;border-bottom:1px solid var(--line);background:var(--card);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
h1{font-size:19px;margin:0}
.pill{padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;background:#eee}
.pill.ok{background:#e3f4e8;color:var(--ok)} .pill.bad{background:#fdecea;color:var(--acc)}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;padding:16px 20px;max-width:1200px}
@media (max-width:820px){main{grid-template-columns:1fr;padding:16px}}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
h2{font-size:15px;margin:0 0 10px;color:var(--mute);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
button{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}
button:hover{border-color:var(--ink)}
button.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
button.note{color:var(--mute)}
input{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;width:140px}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0}
dt{color:var(--mute)} dd{margin:0;word-break:break-all}
code{font-size:12px;background:#f2efe8;padding:1px 5px;border-radius:4px}
ol{margin:0;padding-left:20px;max-height:380px;overflow:auto}
li{padding:4px 0;border-bottom:1px dashed var(--line)}
.num{font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums}
.tag{font-size:12px;color:var(--mute)}
.wide{grid-column:1/-1}
iframe{width:100%;aspect-ratio:9/16;max-height:640px;border:1px solid var(--line);border-radius:10px;background:#1a0503}
.small{font-size:13px;color:var(--mute)}
</style>
</head>
<body>
<header>
  <h1>แผงควบคุมสุ่มเลข</h1>
  <span class="pill" id="tf">TikFinity: …</span>
  <span class="small">overlay สำหรับ OBS: <code id="ovl"></code></span>
</header>
<main>
  <section>
    <h2>จำลองเหตุการณ์ (ซ้อมโดยไม่ต้องไลฟ์จริง)</h2>
    <div class="row"><input id="nm" value="แม่มณี ปากน้ำ"><button onclick="nm.value=randName()">สุ่มชื่อ</button></div>
    <div class="row">
      <button onclick="sim('chat',{comment:'สาธุ ขอให้โชคดี'})">💬 คอมเมนต์ "สาธุ"</button>
      <button onclick="sim('chat',{comment:'สวัสดีค่ะ'})" class="note">💬 คอมเมนต์ทั่วไป</button>
    </div>
    <div class="row">
      <button onclick="roseStreak()">🌹 Rose x5 (combo)</button>
      <button onclick="gift('Doughnut',30,2)">🍩 Doughnut</button>
      <button onclick="gift('Lion',29999,2)">🦁 Lion</button>
    </div>
    <div class="row">
      <button onclick="like(100)">❤️ +100 ไลก์</button>
      <button onclick="sim('follow',{})">➕ ติดตาม</button>
      <button onclick="sim('share',{})">📣 แชร์</button>
    </div>
    <p class="small">ของขวัญทุกแบบได้แค่การ์ดขอบคุณ ส่วนเลขสุ่มมาจากคอมเมนต์คำสำคัญ ยอดไลก์ รอบตามเวลา และปุ่มด้านล่างเท่านั้น</p>
  </section>

  <section>
    <h2>ควบคุมจริง</h2>
    <div class="row">
      <button class="primary" onclick="post('/api/manual-draw')">🎲 สุ่มรอบพิเศษตอนนี้</button>
      <button onclick="reveal()">🔓 เปิดเผย seed + เริ่ม session ใหม่</button>
    </div>
    <dl id="st"></dl>
  </section>

  <section>
    <h2>ตัวอย่าง overlay</h2>
    <iframe id="frame" title="ตัวอย่าง overlay"></iframe>
  </section>

  <section>
    <h2>ที่ขึ้นจอล่าสุด</h2>
    <ol id="recent"></ol>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const ovl = location.origin + '/overlay';
$('ovl').textContent = ovl;
$('frame').src = '/overlay?bg=1';
const NAMES = ['แม่มณี ปากน้ำ','พี่ต้น สายบุญ','ป้าแดง 🌸','น้องฟ้า','ลุงสมชาย','คุณจอย','Ploy.p','บุญมา','เจ๊หมวย','อ้อม สาธุ'];
const randName = () => NAMES[Math.random()*NAMES.length|0];
let uidSeq = Date.now() % 100000;

async function post(url, body){
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body||{})});
  return r.json();
}
function user(){ const n = $('nm').value || 'ผู้ชม'; return {uniqueId: 'u_' + [...n].reduce((a,c)=>a+c.charCodeAt(0),0), nickname: n}; }
function sim(event, extra){ return post('/api/simulate', {event, data: {...user(), ...extra}}); }
function gift(giftName, diamondCount, giftType, repeatCount=1, repeatEnd=true, groupId){
  return sim('gift', {giftName, diamondCount, giftType, repeatCount, repeatEnd, giftId: giftName, groupId: groupId ?? ('g' + (++uidSeq))});
}
async function roseStreak(){
  const g = 'g' + (++uidSeq);
  for (let i = 1; i <= 5; i++){ await gift('Rose', 1, 1, i, false, g); }
  await gift('Rose', 1, 1, 5, true, g);   // ครั้งสุดท้ายของ combo — นับแค่ครั้งนี้
}
function like(n){ return sim('like', {likeCount: n}); }
async function reveal(){
  if (!confirm('เปิดเผย seed ของ session นี้แล้วเริ่ม session ใหม่?')) return;
  const r = await post('/api/reveal');
  alert('seed: ' + r.result.seed + '\n\nรัน  py verify.py  เพื่อตรวจย้อนหลังได้');
}

function render(s){
  const tf = $('tf');
  tf.textContent = 'TikFinity: ' + (s.tikfinity === 'connected' ? 'เชื่อมต่อแล้ว' : 'ยังไม่เชื่อมต่อ');
  tf.className = 'pill ' + (s.tikfinity === 'connected' ? 'ok' : 'bad');
  const rows = [
    ['session', s.session], ['commit (SHA-256)', s.commit], ['สุ่มไปแล้ว', s.draw_index + ' รอบ'],
    ['คิวรอขึ้นจอ', `สุ่ม ${s.draw_queue} · ขอบคุณ ${s.thanks_queue}`],
    ['ไลก์รวม', `${s.total_likes.toLocaleString()} (รอบถัดไปที่ ${s.next_like_milestone.toLocaleString()})`],
    ['รอบตามเวลาอีก', `${Math.floor(s.timer_in/60)} นาที ${s.timer_in%60} วิ`],
    ['ของขวัญ', `${s.stats.gifts} ครั้ง · ${s.stats.diamonds.toLocaleString()} diamonds`],
    ['ตกคิว (คิวเต็ม)', s.stats.dropped],
  ];
  if (s.tikfinity !== 'connected' && s.tikfinity_error) rows.push(['สาเหตุ', s.tikfinity_error]);
  const dl = $('st'); dl.textContent = '';
  for (const [k, v] of rows){ const dt = document.createElement('dt'); dt.textContent = k; const dd = document.createElement('dd'); dd.textContent = v; dl.append(dt, dd); }
}
function addRecent(m){
  const li = document.createElement('li');
  if (m.type === 'draw'){
    const b = document.createElement('span'); b.className = 'num'; b.textContent = m.number;
    li.append(b, ' ', m.who ? 'ของ ' + m.who : (m.label || ''));
    const t = document.createElement('span'); t.className = 'tag'; t.textContent = `  #${m.index} · ${m.trigger}`; li.append(t);
  } else {
    li.textContent = m.text;
    const t = document.createElement('span'); t.className = 'tag'; t.textContent = '  ' + m.tier; li.append(t);
  }
  $('recent').prepend(li);
  while ($('recent').children.length > 40) $('recent').lastChild.remove();
}
fetch('/api/state').then(r => r.json()).then(s => { render(s); [...s.recent].reverse().forEach(addRecent); });
const es = new EventSource('/events');
es.onmessage = ev => { const m = JSON.parse(ev.data); if (m.type === 'state') render(m); else if (m.type === 'draw' || m.type === 'thanks') addRecent(m); };
</script>
</body>
</html>
