<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay สุ่มเลข</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* ออกแบบที่ 1080x1920 (จอแนวตั้งของ TikTok) แล้วย่อขยายให้พอดีหน้าต่าง
   ?bg=1 = แสดงฉากหลัง (ไว้ดูตอนทดสอบ)  ?tts=1 = อ่านคำขอบคุณออกเสียง */
:root{
  --gold:#f5c542; --gold-2:#ffe08a; --gold-dk:#a8761a;
  --red:#8e1414; --red-2:#b3261e; --ink:#2a0a05; --cream:#fff7e6;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:transparent;font-family:"Noto Sans Thai",system-ui,sans-serif}
body.bg{background:#1a0503}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}
body.bg #stage{background:
  radial-gradient(ellipse at 50% 38%, #6d1a10 0%, #3a0a06 45%, #1a0503 80%)}

/* ป้ายแจ้งเตือน — อยู่ตลอดเวลา */
.disclaimer{position:absolute;left:40px;right:40px;top:40px;padding:18px 28px;border-radius:22px;
  background:rgba(20,4,2,.78);border:2px solid var(--gold-dk);color:var(--cream);
  font-size:30px;line-height:1.35;text-align:center;font-weight:600}

.hint{position:absolute;left:40px;right:40px;bottom:60px;padding:22px 28px;border-radius:26px;text-align:center;
  background:linear-gradient(180deg,var(--red-2),var(--red));border:3px solid var(--gold);
  color:#fff;font-size:44px;font-weight:800;box-shadow:0 10px 40px rgba(0,0,0,.45)}
.hint b{color:var(--gold-2)}
.hint small{display:block;font-size:28px;font-weight:600;opacity:.9;margin-top:4px}

/* แถบความคืบหน้า */
.meters{position:absolute;left:40px;right:40px;top:200px;display:flex;gap:20px}
.meter{flex:1;padding:16px 22px;border-radius:20px;background:rgba(20,4,2,.72);border:2px solid rgba(245,197,66,.45);color:var(--cream)}
.meter .lbl{font-size:26px;opacity:.9}
.meter .val{font-size:40px;font-weight:800;color:var(--gold-2)}
.bar{height:16px;border-radius:9px;background:rgba(255,255,255,.15);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-dk),var(--gold-2));transition:width .6s}

/* เวทีสุ่ม */
.altar{position:absolute;left:0;right:0;top:420px;height:900px;display:flex;flex-direction:column;align-items:center}
.who{height:110px;font-size:52px;font-weight:800;color:#fff;text-shadow:0 4px 18px rgba(0,0,0,.7);text-align:center;padding:0 40px;
  opacity:0;transition:opacity .4s}
.who.show{opacity:1}
.who small{display:block;font-size:32px;font-weight:600;color:var(--gold-2)}

.siamsi{position:relative;width:300px;height:420px;margin-top:110px}
.siamsi .tube{position:absolute;left:30px;bottom:0;width:240px;height:330px;border-radius:24px 24px 40px 40px;
  background:linear-gradient(90deg,#7a1010,#c2321f 35%,#e0563a 50%,#c2321f 65%,#7a1010);
  border:6px solid var(--gold);box-shadow:inset 0 -20px 40px rgba(0,0,0,.35),0 20px 50px rgba(0,0,0,.5)}
.siamsi .tube::before{content:"";position:absolute;left:18px;right:18px;top:110px;height:70px;border-radius:12px;
  border:4px solid var(--gold);background:rgba(0,0,0,.15)}
.siamsi .tube::after{content:"☸";position:absolute;left:0;right:0;top:112px;text-align:center;font-size:56px;color:var(--gold-2)}
.stick{position:absolute;bottom:250px;width:22px;height:200px;border-radius:6px;
  background:linear-gradient(90deg,#c79a4a,#f0d79a,#c79a4a);border:2px solid #8a6424}
.stick.s1{left:80px;transform:rotate(-9deg)} .stick.s2{left:115px;height:220px;transform:rotate(-3deg)}
.stick.s3{left:150px;height:230px} .stick.s4{left:185px;height:215px;transform:rotate(4deg)}
.stick.s5{left:215px;transform:rotate(10deg)}
.stick.pop{transition:transform .5s cubic-bezier(.2,1.6,.4,1),bottom .5s;bottom:340px;transform:rotate(0) scale(1.08);
  box-shadow:0 0 30px var(--gold-2)}
.siamsi.shake{animation:shake .18s ease-in-out infinite}
@keyframes shake{0%{transform:rotate(-7deg) translateY(0)}50%{transform:rotate(7deg) translateY(-8px)}100%{transform:rotate(-7deg) translateY(0)}}

.number{display:flex;gap:22px;margin-top:30px;opacity:0;transform:scale(.7);transition:opacity .35s,transform .45s cubic-bezier(.2,1.5,.4,1)}
.number.show{opacity:1;transform:scale(1)}
.digit{width:170px;height:220px;border-radius:28px;display:grid;place-items:center;font-size:160px;font-weight:800;color:var(--ink);
  background:linear-gradient(180deg,var(--gold-2),var(--gold) 55%,var(--gold-dk));border:5px solid #fff3c4;
  box-shadow:0 14px 40px rgba(0,0,0,.5),inset 0 -10px 20px rgba(0,0,0,.18);font-variant-numeric:tabular-nums}
.idle{position:absolute;top:520px;left:0;right:0;text-align:center;color:var(--cream);font-size:36px;opacity:.85}

/* การ์ดขอบคุณ */
.thanks{position:absolute;left:40px;right:40px;bottom:250px;display:flex;flex-direction:column-reverse;gap:14px}
.card{padding:20px 26px;border-radius:22px;font-size:36px;font-weight:700;color:#fff;
  background:rgba(25,6,3,.85);border:2px solid rgba(255,255,255,.25);
  animation:cardIn .45s cubic-bezier(.2,1.4,.4,1) both;display:flex;align-items:center;gap:16px}
.card .ic{font-size:44px}
.card.gold{border:3px solid var(--gold);background:linear-gradient(90deg,rgba(120,70,0,.9),rgba(40,10,4,.9))}
.card.grand{border:4px solid var(--gold-2);font-size:42px;background:linear-gradient(90deg,#8e1414,#c9891c);
  box-shadow:0 0 40px rgba(255,224,138,.7)}
.card.out{animation:cardOut .5s ease forwards}
@keyframes cardIn{from{opacity:0;transform:translateX(-60px) scale(.9)}to{opacity:1;transform:none}}
@keyframes cardOut{to{opacity:0;transform:translateY(20px)}}

.offline{position:absolute;right:40px;top:150px;font-size:22px;color:#ffb4a8;background:rgba(0,0,0,.6);
  padding:6px 14px;border-radius:10px;display:none}
</style>
</head>
<body>
<div id="stage">
  <div class="disclaimer" id="disclaimer">เลขสุ่มด้วยคอมพิวเตอร์ เพื่อความบันเทิงเท่านั้น · ไม่มีรางวัล · ไม่เกี่ยวข้องกับผลสลากใดๆ</div>
  <div class="offline" id="offline">กำลังเชื่อมต่อ…</div>

  <div class="meters">
    <div class="meter">
      <div class="lbl">ไลก์รวม · รอบรวมพลังถัดไป</div>
      <div class="val" id="likes">0 / 500</div>
      <div class="bar"><i id="likeBar"></i></div>
    </div>
    <div class="meter">
      <div class="lbl">รอบสุ่มตามเวลา</div>
      <div class="val" id="timer">--:--</div>
      <div class="bar"><i id="timerBar"></i></div>
    </div>
  </div>

  <div class="altar">
    <div class="who" id="who"></div>
    <div class="siamsi" id="siamsi">
      <div class="stick s1"></div><div class="stick s2"></div><div class="stick s3" id="mainStick"></div>
      <div class="stick s4"></div><div class="stick s5"></div>
      <div class="tube"></div>
    </div>
    <div class="number" id="number"></div>
  </div>

  <div class="thanks" id="thanks"></div>

  <div class="hint" id="hint">พิมพ์ <b>"สาธุ"</b> ในคอมเมนต์ รับเลขสุ่มฟรี<small>ทุกคนร่วมสนุกได้ ไม่ต้องส่งของขวัญ</small></div>
</div>

<script>
const params = new URLSearchParams(location.search);
if (params.get('bg') === '1') document.body.classList.add('bg');
const TTS = params.get('tts') === '1';
const $ = id => document.getElementById(id);

function fit(){
  const s = Math.min(innerWidth/1080, innerHeight/1920);
  $('stage').style.transform = `scale(${s})`;
  $('stage').style.left = ((innerWidth - 1080*s)/2) + 'px';
}
addEventListener('resize', fit); fit();

/* ---------- เสียง ---------- */
let thaiVoice = null;
function pickVoice(){ thaiVoice = speechSynthesis.getVoices().find(v => /th/i.test(v.lang)) || null; }
if (TTS && 'speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text){
  if (!TTS || !('speechSynthesis' in window) || !text) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'th-TH'; if (thaiVoice) u.voice = thaiVoice; u.rate = 1.0;
  speechSynthesis.speak(u);
}

/* ---------- การ์ดขอบคุณ ---------- */
const ICON = {gift:'🎁', follow:'🙏', share:'📣'};
function showThanks(t){
  const card = document.createElement('div');
  card.className = 'card ' + (t.tier || 'normal');
  const ic = document.createElement('span'); ic.className = 'ic';
  ic.textContent = t.tier === 'grand' ? '🌟' : (ICON[t.kind] || '🙏');
  const tx = document.createElement('span'); tx.textContent = t.text;   // textContent เสมอ กันชื่อแปลกๆ
  card.append(ic, tx);
  const box = $('thanks');
  box.prepend(card);
  while (box.children.length > 4) box.lastChild.remove();
  setTimeout(() => { card.classList.add('out'); setTimeout(() => card.remove(), 500); },
             t.tier === 'grand' ? 9000 : t.tier === 'gold' ? 7000 : 5000);
  say(t.speech);
}

/* ---------- พิธีสุ่ม ---------- */
let drawing = Promise.resolve();
const wait = ms => new Promise(r => setTimeout(r, ms));
function showDraw(d){
  drawing = drawing.then(async () => {
    const who = $('who'), num = $('number'), tube = $('siamsi'), stick = $('mainStick');
    who.textContent = '';
    if (d.who){ who.append('เลขสุ่มของคุณ ' + d.who); }
    else { who.append(d.label || 'รอบรวมพลัง'); }
    const sm = document.createElement('small'); sm.textContent = 'รอบที่ ' + d.index; who.append(sm);
    who.classList.add('show');
    num.classList.remove('show'); stick.classList.remove('pop');
    tube.classList.add('shake');
    await wait(2200);
    tube.classList.remove('shake'); stick.classList.add('pop');
    await wait(500);
    num.textContent = '';
    const cells = [...d.number].map(() => { const c = document.createElement('div'); c.className = 'digit'; c.textContent = '0'; num.append(c); return c; });
    num.classList.add('show');
    // หมุนตัวเลขให้ดูตื่นเต้น แล้วค่อยหยุดทีละหลัก (เลขจริงมาจาก server แล้ว หน้าจอแค่แสดง)
    const roll = setInterval(() => cells.forEach((c, i) => { if (!c.dataset.done) c.textContent = (Math.random()*10|0); }), 60);
    for (let i = 0; i < cells.length; i++){ await wait(450); cells[i].dataset.done = 1; cells[i].textContent = d.number[i]; }
    clearInterval(roll);
    say((d.who ? 'เลขสุ่มของคุณ ' + d.who : (d.label || 'รอบรวมพลัง')) + ' คือ ' + [...d.number].join(' '));
    await wait(2600);
    who.classList.remove('show'); num.classList.remove('show'); stick.classList.remove('pop');
    await wait(300);
  });
}

/* ---------- สถานะ ---------- */
function showState(s){
  $('disclaimer').textContent = s.disclaimer || $('disclaimer').textContent;
  const step = s.like_milestone || 500, base = s.next_like_milestone - step;
  $('likes').textContent = `${s.total_likes.toLocaleString()} / ${s.next_like_milestone.toLocaleString()}`;
  $('likeBar').style.width = Math.min(100, (s.total_likes - base) / step * 100) + '%';
  const m = Math.floor(s.timer_in/60), sec = s.timer_in % 60;
  $('timer').textContent = `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  $('timerBar').style.width = (100 - Math.min(100, s.timer_in / (s.timer_total || 600) * 100)) + '%';
  if (s.keywords && s.keywords[0]){
    const b = $('hint').querySelector('b'); b.textContent = `"${s.keywords[0]}"`;
  }
}

/* ---------- ต่อกับ draw server ---------- */
function connect(){
  const es = new EventSource('/events');
  es.onopen = () => $('offline').style.display = 'none';
  es.onerror = () => $('offline').style.display = 'block';
  es.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type === 'draw') showDraw(m);
    else if (m.type === 'thanks') showThanks(m);
    else if (m.type === 'state') showState(m);
  };
}
connect();
</script>
</body>
</html>
